<!doctype html>
<html lang="sr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pločice i Traka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header with look and layout switches, one Neo screen (wallpaper, tiles on the Shelf, the Bar), then a how-to strip. Same tokens as the other Neo demos. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --fg:#1b2125; --muted:#56616a; --line:#cfd4cd; --accent:#0d6f78; --amber:#c86f00; --good:#2f7d32; --bad:#b3261e; --soft:#e2e6e0;
  --font-display:"Chakra Petch","Bahnschrift",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131719;--panel:#1b2023;--fg:#e4e8e5;--muted:#9aa5ac;--line:#2e363a;--accent:#4fb7bf;--amber:#f2a33a;--good:#6cc070;--bad:#f2786d;--soft:#252b2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131719;--panel:#1b2023;--fg:#e4e8e5;--muted:#9aa5ac;--line:#2e363a;--accent:#4fb7bf;--amber:#f2a33a;--good:#6cc070;--bad:#f2786d;--soft:#252b2f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:grid;gap:16px}
.top{display:grid;gap:12px}
.top h1{font-family:var(--font-display);font-size:clamp(26px,4vw,38px);margin:0;line-height:1.05;text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted);max-width:76ch}
.back{font:600 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--accent)}
.stripe{display:flex;gap:4px;height:6px;width:120px;margin-bottom:8px}.stripe i{flex:1;background:var(--accent)}.stripe i:nth-child(2){background:var(--amber)}.stripe i:nth-child(3){background:var(--fg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl label{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:600 13px var(--font-body);border:0;background:transparent;color:var(--fg);padding:7px 11px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* The screen. Looks are set on .screen as data-look; each look is its own committed palette. */
.screen{position:relative;height:600px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  --wall:linear-gradient(160deg,#5a8086 0%,#2f4f55 55%,#1c3236 100%); --ink:#1b2125; --tile:#f4f6f3e6; --tileline:#ffffff66;
  --bar:#ffffff40; --barline:#ffffff70; --barink:#0d1b1e; --bar-blur:14px; --hi:#0d6f78; --menu:#f8f9f6; --menuink:#1b2125;
  background:var(--wall); font-family:var(--font-body); color:var(--ink)}
.screen[data-look="srebro"]{--wall:linear-gradient(180deg,#c9ced3,#9aa3ab); --bar:linear-gradient(180deg,#f3f5f7,#cfd5da); --barline:#8d969e; --barink:#1b2125; --bar-blur:0px; --tile:#eef1f3; --tileline:#9aa3ab; --hi:#3a6ea5}
.screen[data-look="klasik"]{--wall:#6b8e8e; --bar:#c3c7cb; --barline:#ffffff; --barink:#000; --bar-blur:0px; --tile:#c3c7cb; --tileline:#000; --hi:#000080; --menu:#c3c7cb; --menuink:#000}
.screen[data-look="kristal"]{--wall:radial-gradient(120% 90% at 20% 10%,#7fd3ff 0%,#2a5d9c 45%,#0e1d3a 100%); --bar:linear-gradient(180deg,#ffffff55,#9fd8ff22); --barline:#bfe9ff; --barink:#04203d; --bar-blur:10px; --tile:#eaf7ffd9; --tileline:#bfe9ff; --hi:#0a6fb8}
.screen[data-look="klasik"] .tile,.screen[data-look="klasik"] .bar,.screen[data-look="klasik"] .menu,.screen[data-look="klasik"] .palette{border-radius:0;box-shadow:inset -1px -1px #404040,inset 1px 1px #fff}
.desk{position:absolute;inset:0 0 52px 0;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.screen[data-layout="pristaniste"] .desk{inset:0 0 72px 0}
.screen[data-layout="traka"] .desk{inset:44px 0 0 0}
.screen[data-layout="lako"] .desk{grid-template-columns:minmax(0,1fr)}
.screen[data-layout="lako"] .shelf{display:none}
.deskicons{display:grid;grid-template-columns:repeat(auto-fill,88px);gap:10px;align-content:start}
.dicon{display:grid;justify-items:center;gap:4px;padding:6px;border:0;background:none;color:#fff;font:12px var(--font-body);text-shadow:0 1px 2px #0008;cursor:pointer;border-radius:6px}
.dicon:hover{background:#ffffff22}
.dicon svg{width:44px;height:44px}
.lako{display:none;align-self:center;justify-self:center;background:var(--tile);border:1px solid var(--tileline);border-radius:14px;padding:20px;max-width:520px;width:100%}
.screen[data-layout="lako"] .lako{display:grid;gap:12px}
.screen[data-layout="lako"] .deskicons{display:none}
.lako h2{margin:0;font:600 20px var(--font-display)}
.lako .big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lako .big button{font:600 15px var(--font-body);padding:16px 8px;border-radius:10px;border:1px solid var(--tileline);background:#ffffff;color:#1b2125;cursor:pointer}
.shelf{display:grid;gap:10px;align-content:start;grid-auto-rows:max-content;min-height:0;overflow:auto;padding-right:2px}
.tile{background:var(--tile);border:1px solid var(--tileline);border-radius:12px;box-shadow:0 6px 18px #0003;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;color:#1b2125}
.tile header{display:flex;align-items:center;gap:6px;padding:5px 8px;font:600 12px var(--font-display);letter-spacing:.03em}
.tile header span{flex:1;min-width:0}
.tile header button{font:600 11px var(--font-mono);border:0;background:none;color:#56616a;cursor:pointer;padding:2px 4px;border-radius:4px}
.tile header button:hover{background:#0001;color:#1b2125}
.tile .body{padding:4px 10px 10px}
.tile.small .body{padding:2px 10px 8px}
.face-note{font:11px var(--font-mono);color:#56616a}
.clock svg{display:block;margin:0 auto}
.digits{font:600 26px var(--font-mono);font-variant-numeric:tabular-nums;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font:12px var(--font-mono);text-align:center}
.cal b{color:#56616a;font-weight:600}
.cal .today{background:var(--hi);color:#fff;border-radius:4px}
.meter svg{width:100%;height:46px;display:block}
.meter .row{display:flex;justify-content:space-between;font:12px var(--font-mono)}
.notes textarea{width:100%;min-height:70px;resize:vertical;font:13px var(--font-body);border:1px solid #cfd4cd;border-radius:6px;padding:6px;background:#fffef6;color:#1b2125}
.calc .disp{font:600 20px var(--font-mono);text-align:right;background:#fff;border:1px solid #cfd4cd;border-radius:6px;padding:4px 8px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calc .keys button{font:600 14px var(--font-mono);padding:6px 0;border:1px solid #cfd4cd;border-radius:6px;background:#f8f9f6;color:#1b2125;cursor:pointer}
.calc .keys button.op{color:var(--hi)}
.batt{display:flex;align-items:center;gap:10px;font:600 14px var(--font-mono)}
.batt i{flex:1;height:14px;border:2px solid #1b2125;border-radius:3px;position:relative}
.batt i::after{content:"";position:absolute;inset:1px;width:calc(var(--lvl) - 2px);background:var(--good)}
.weather{display:flex;gap:10px;align-items:center}
.weather .t{font:600 28px var(--font-mono)}
.weather small{color:#56616a}

/* A tile opened as a window (its third face) */
.tilewin{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(420px,90%);z-index:5;box-shadow:0 18px 40px #0006}

/* The Bar */
.bar{position:absolute;left:0;right:0;bottom:0;height:52px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 10px;background:var(--bar);border-top:1px solid var(--barline);backdrop-filter:blur(var(--bar-blur));-webkit-backdrop-filter:blur(var(--bar-blur));color:var(--barink);z-index:4}
.screen[data-layout="traka"] .bar{top:0;bottom:auto;height:44px;border-top:0;border-bottom:1px solid var(--barline)}
.screen[data-layout="pristaniste"] .bar{left:50%;right:auto;transform:translateX(-50%);bottom:10px;height:58px;border:1px solid var(--barline);border-radius:16px;grid-template-columns:auto auto auto}
.screen[data-layout="lako"] .bar .sec.run,.screen[data-layout="lako"] .bar .sec.help{display:none}
.sec{display:flex;gap:4px;align-items:center;min-width:0}
.sec.run{overflow:hidden}
.sec+.sec{border-left:1px solid var(--barline);padding-left:8px}
.bbtn{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;color:inherit;font:600 13px var(--font-body);padding:5px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.bbtn:hover{background:#ffffff40;border-color:var(--barline)}
.bbtn.on{background:#ffffff55;border-color:var(--barline)}
.bbtn svg{width:20px;height:20px;flex:none}
.neo{font:700 14px var(--font-display);letter-spacing:.04em}
.tray{font:600 12px var(--font-mono);font-variant-numeric:tabular-nums}

.menu{position:absolute;left:10px;bottom:60px;width:260px;background:var(--menu);color:var(--menuink);border:1px solid #9aa19c;border-radius:10px;box-shadow:0 14px 30px #0005;padding:6px;z-index:6;display:grid}
.screen[data-layout="traka"] .menu{top:50px;bottom:auto}
.menu button{text-align:left;border:0;background:none;color:inherit;font:14px var(--font-body);padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--hi);color:#fff}
.menu hr{border:0;border-top:1px solid #cfd4cd;margin:4px 6px}
.menu small{padding:4px 10px;color:#56616a;font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.palette{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(480px,92%);background:var(--menu);color:var(--menuink);border:1px solid #9aa19c;border-radius:12px;box-shadow:0 18px 40px #0006;z-index:7;overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid #cfd4cd;font:16px var(--font-body);padding:12px 14px;background:transparent;color:inherit;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:260px;overflow:auto}
.palette li button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;border:0;background:none;color:inherit;font:14px var(--font-body);padding:7px 10px;border-radius:6px;cursor:pointer}
.palette li button:hover,.palette li button.sel{background:var(--hi);color:#fff}
.palette li small{opacity:.7}
.toast{position:absolute;right:14px;bottom:64px;background:#1b2125;color:#fff;font:13px var(--font-body);padding:8px 12px;border-radius:8px;z-index:8;box-shadow:0 8px 20px #0005}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how section{min-width:0}
.how h3{font:600 15px var(--font-display);margin:0 0 4px}
.how p,.how li{color:var(--muted);font-size:14px;margin:0}
.how ul{margin:0;padding-left:18px}
kbd{font:600 12px var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel);color:var(--fg)}
@media (max-width:860px){
  .screen{height:720px}
  .desk{grid-template-columns:minmax(0,1fr)}
  .deskicons{display:none}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .bar .lbl{display:none}
  .how{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <a class="back" id="back" href="neo-demoi.html"></a>
      <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>

      <label id="l-look"></label><div class="seg" role="group" id="looks"></div>

  <div class="screen" id="screen" data-look="staklo" data-layout="neo">

  </div>
</div>

<script>
const LANG = "sr";
const SR = LANG === "sr";
const T = SR ? {
  back:"← Svi demoi", h1:"Pločice i Traka",
  lead:"Kako NeoOS rešava vidžete i traku zadataka bez jednog Start menija. Pločica ima tri lica: malo, veliko i prozor. Traka ima tri odvojena dela: pokretanje, ono što radi i pomagače. Neo meni nosi sistem, a paleta komandi traži sve. Ovo je koncept iz specifikacije 8i.",
  look:"Izgled", layout:"Raspored",
  looks:{staklo:"Staklo",srebro:"Srebro",klasik:"Klasik",kristal:"Kristal"},
  layouts:{neo:"Neo",traka:"Traka",pristaniste:"Pristanište",lako:"Lako"},
  faces:{small:"malo",big:"veliko",win:"prozor"},
  tiles:{sat:"Sat",kal:"Kalendar",mer:"Merač",bel:"Beleške",vre:"Vreme",bat:"Baterija",kalk:"Kalkulator"},
  apps:{ormar:"Ormar",pero:"Pero",preg:"Pregledač",dos:"Neo DOS"},
  neoMenu:[["sys","O ovom Neo-u"],["sys","Podešavanja"],["-",""],["h","Skorašnje"],["doc","Pismo baki"],["doc","Budžet 2027"],["-",""],["pal","Traži… (Neo+razmak)"],["sys","Spavanje"],["sys","Isključi"]],
  palPh:"Traži programe, pločice, dokumente…",
  kinds:{app:"program",tile:"pločica",doc:"dokument",cmd:"komanda"},
  started:n=>`${n} je pokrenut. Vidi ga u srednjem delu Trake.`, closed:n=>`${n} je zatvoren.`, pinned:n=>`Pločica ${n} je na Polici.`,
  lakoH:"Šta danas radiš?", lakoB:["Pišem","Gledam slike","Učim"],
  noteDefault:"Kupiti NVMe kertridž.\nPozvati baku u nedelju.",
  weather:["Beograd","Sunčano, slab vetar"], battery:"puna za oko 6 h",
  week:["Po","Ut","Sr","Če","Pe","Su","Ne"],
  hA:"Šta probati", lA:["Klikni ◱ na pločici: menja lice (malo, veliko, prozor).","Klikni ◆ Neo na Traci za Neo meni.","Pritisni Ctrl+razmak (ili Traži u meniju) i upiši „kal”.","Promeni izgled u Kristal i raspored u Pristanište."],
  hB:"Pravila pločice", lB:["Svaka pločica je zaseban proces na Tvrđavi.","Manifest kaže šta sme: mreža, fajlovi, kalendar.","Najviše 8 MB i jedno osvežavanje u sekundi.","U Lite izdanju Traka nije providna, zbog brzine."],
  hC:"Zašto nema Start menija", pC:"Pokretanje je na Policama, a ono što je otvoreno vidiš u Traci. Sistem i nedavni dokumenti su u Neo meniju, kao Apple meni na Macu. Sve ostalo nađeš paletom komandi. Lako raspored počinje pitanjem „Šta danas radiš?”."
} : {
  back:"← All demos", h1:"Tiles and the Bar",
  lead:"How NeoOS handles widgets and the taskbar without a single Start menu. A tile has three faces: small, large and window. The Bar has three separate sections: launching, what is running, and helpers. The Neo menu holds the system, and the command palette finds everything. This is a concept from specification 8i.",
  look:"Look", layout:"Layout",
  looks:{staklo:"Glass",srebro:"Silver",klasik:"Classic",kristal:"Crystal"},
  layouts:{neo:"Neo",traka:"Bar",pristaniste:"Harbour",lako:"Easy"},
  faces:{small:"small",big:"large",win:"window"},
  tiles:{sat:"Clock",kal:"Calendar",mer:"Meter",bel:"Notes",vre:"Weather",bat:"Battery",kalk:"Calculator"},
  apps:{ormar:"Cabinet",pero:"Quill",preg:"Browser",dos:"Neo DOS"},
  neoMenu:[["sys","About this Neo"],["sys","Settings"],["-",""],["h","Recent"],["doc","Letter to Gran"],["doc","Budget 2027"],["-",""],["pal","Find… (Neo+Space)"],["sys","Sleep"],["sys","Shut down"]],
  palPh:"Find programs, tiles, documents…",
  kinds:{app:"program",tile:"tile",doc:"document",cmd:"command"},
  started:n=>`${n} started. See it in the middle of the Bar.`, closed:n=>`${n} closed.`, pinned:n=>`The ${n} tile is on the Shelf.`,
  lakoH:"What are you doing today?", lakoB:["Writing","Looking at photos","Learning"],
  noteDefault:"Buy an NVMe cartridge.\nCall Gran on Sunday.",
  weather:["London","Sunny, light wind"], battery:"full for about 6 h",
  week:["Mo","Tu","We","Th","Fr","Sa","Su"],
  hA:"Things to try", lA:["Click ◱ on a tile to change its face (small, large, window).","Click ◆ Neo on the Bar for the Neo menu.","Press Ctrl+Space (or Find in the menu) and type \"cal\".","Switch the look to Crystal and the layout to Harbour."],
  hB:"Tile rules", lB:["Each tile is its own process on Fortress.","Its manifest says what it may use: network, files, calendar.","At most 8 MB and one refresh a second.","In the Lite edition the Bar is not see-through, for speed."],
  hC:"Why there is no Start menu", pC:"Launching lives on the Shelves, and what is open shows in the Bar. The system and recent documents sit in the Neo menu, like the Apple menu on the Mac. Everything else is found with the command palette. The Easy layout starts by asking \"What are you doing today?\"."
};

const $ = id => document.getElementById(id);
const screen = $("screen");
const icon = {
  ormar:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z" fill="#c86f00" stroke="#1b2125"/></svg>',
  pero:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l3-1 11-11-2-2L6 16z" fill="#0d6f78" stroke="#1b2125"/></svg>',
  preg:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#4fb7bf" stroke="#1b2125"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16" fill="none" stroke="#1b2125"/></svg>',
  dos:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="#0f1517" stroke="#1b2125"/><path d="M6 10l3 2-3 2M11 15h5" stroke="#ffb547" fill="none"/></svg>',
};
const TILE_ORDER = ["sat","kal","mer","bel","vre","bat","kalk"];
let shelf = ["sat","kal","mer","bel","kalk"];
let face = {sat:"big",kal:"small",mer:"big",bel:"small",vre:"small",bat:"small",kalk:"small"};
let running = new Set(["ormar"]);
let notes = T.noteDefault, calcExpr = "", calcShown = "0";
const cpuHist = Array.from({length:40},(_,i)=>20+12*Math.sin(i/3)+Math.random()*8);

function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }

function clockSvg(r){
  const d=new Date(), s=d.getSeconds(), m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  const hand=(a,l,w,c)=>`<line x1="${r}" y1="${r}" x2="${r+l*Math.sin(a)}" y2="${r-l*Math.cos(a)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  let ticks=""; for(let i=0;i<12;i++){const a=i*Math.PI/6; ticks+=`<line x1="${r+(r-6)*Math.sin(a)}" y1="${r-(r-6)*Math.cos(a)}" x2="${r+(r-2)*Math.sin(a)}" y2="${r-(r-2)*Math.cos(a)}" stroke="#1b2125" stroke-width="${i%3?1:2}"/>`;}
  return `<svg width="${2*r}" height="${2*r}" viewBox="0 0 ${2*r} ${2*r}" role="img" aria-label="${d.toLocaleTimeString()}"><circle cx="${r}" cy="${r}" r="${r-1}" fill="#fff" stroke="#1b2125"/>${ticks}${hand(h*Math.PI/6,r*.5,3,"#1b2125")}${hand(m*Math.PI/30,r*.75,2,"#1b2125")}${hand(s*Math.PI/30,r*.82,1,"#c86f00")}<circle cx="${r}" cy="${r}" r="2" fill="#c86f00"/></svg>`;
}
function calHtml(full){
  const d=new Date(), y=d.getFullYear(), mo=d.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate();
  const title=d.toLocaleDateString(SR?"sr-Latn":"en-GB",{month:"long",year:"numeric"});
  if(!full) return `<div class="digits" style="font-size:22px">${d.getDate()}. ${d.toLocaleDateString(SR?"sr-Latn":"en-GB",{weekday:"long"})}</div>`;
  let c=T.week.map(w=>`<b>${w}</b>`).join(""); for(let i=0;i<first;i++) c+="<span></span>";
  for(let i=1;i<=days;i++) c+=`<span class="${i===d.getDate()?"today":""}">${i}</span>`;
  return `<div style="font:600 13px var(--font-display);margin-bottom:4px">${title}</div><div class="cal">${c}</div>`;
}
function meterHtml(full){
  const w=220,h=46,max=100,pts=cpuHist.map((v,i)=>`${(i/(cpuHist.length-1))*w},${h-(v/max)*h}`).join(" ");
  const cpu=Math.round(cpuHist.at(-1));
  const svg=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,${h} ${pts} ${w},${h}" fill="#0d6f7833" stroke="none"/><polyline points="${pts}" fill="none" stroke="#0d6f78" stroke-width="1.5"/></svg>`;
  return `<div class="meter">${full?svg:""}<div class="row"><span>CPU</span><span>${cpu}%</span></div><div class="row"><span>RAM</span><span>${(1.2+cpu/200).toFixed(1)} / 8 GB</span></div>${full?`<div class="row"><span>${SR?"Disk":"Disk"}</span><span>41 GB ${SR?"slobodno":"free"}</span></div>`:""}</div>`;
}
function calcHtml(){ const k=["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","=","+","C"]; return `<div class="calc"><div class="disp" aria-live="polite">${calcShown}</div><div class="keys">${k.map(x=>`<button type="button" class="${/[÷×−+=C]/.test(x)?"op":""}" data-k="${x}">${x}</button>`).join("")}</div></div>`; }
function calcKey(k){
  if(k==="C"){calcExpr="";calcShown="0";}
  else if(k==="="){ try{ const v=Function(`"use strict";return (${calcExpr.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-")||0})`)(); calcShown=String(Math.round(v*1e10)/1e10); calcExpr=calcShown; }catch{ calcShown=SR?"greška":"error"; calcExpr=""; } }
  else { if(!/^[0-9.÷×−+]$/.test(k)) return; calcExpr+=k; calcShown=calcExpr; }
  renderTiles();
}
function tileBody(id,f){
  const full = f!=="small";
  switch(id){
    case "sat": return `<div class="clock">${full?clockSvg(f==="win"?90:56):`<div class="digits">${new Date().toLocaleTimeString(SR?"sr-Latn":"en-GB",{hour:"2-digit",minute:"2-digit"})}</div>`}</div>`;
    case "kal": return calHtml(full);
    case "mer": return meterHtml(full);
    case "bel": return `<div class="notes"><textarea id="note-${f}" aria-label="${T.tiles.bel}" ${full?'style="min-height:140px"':""}>${notes}</textarea></div>`;
    case "vre": return `<div class="weather"><span class="t">${SR?"18°":"14°"}</span><div><b>${T.weather[0]}</b><br><small>${T.weather[1]}</small>${full?`<br><small>${SR?"Sutra 20°, uto 17°":"Tomorrow 16°, Tue 13°"}</small>`:""}</div></div>`;
    case "bat": return `<div class="batt" style="--lvl:86%"><i></i><span>86%</span></div>${full?`<div class="face-note">${T.battery}</div>`:""}`;
    case "kalk": return full ? calcHtml() : `<div class="digits">${calcShown}</div>`;
  }
}
function tileHtml(id, f, inWin){
  return `<div class="tile ${f==="small"?"small":""} ${inWin?"tilewin":""}" data-tile="${id}"><header><span>${T.tiles[id]}</span><span class="face-note">${T.faces[f]}</span><button type="button" data-face="${id}" title="${SR?"Promeni lice":"Change face"}" aria-label="${SR?"Promeni lice":"Change face"}">◱</button>${inWin?`<button type="button" data-close="${id}" aria-label="${SR?"Zatvori":"Close"}">✕</button>`:""}</header><div class="body">${tileBody(id,f)}</div></div>`;
}
function renderTiles(){
  const active=document.activeElement, keepId=active&&active.id, sel=active&&active.selectionStart;
  $("shelf").innerHTML = shelf.filter(id=>face[id]!=="win").map(id=>tileHtml(id,face[id],false)).join("");
  $("winlayer").innerHTML = shelf.filter(id=>face[id]==="win").map(id=>tileHtml(id,"win",true)).join("");
  screen.querySelectorAll("[data-face]").forEach(b=>b.onclick=()=>{ const id=b.dataset.face; face[id]={small:"big",big:"win",win:"small"}[face[id]]; renderTiles(); });
  screen.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{ face[b.dataset.close]="big"; renderTiles(); });
  screen.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>calcKey(b.dataset.k));
  screen.querySelectorAll("textarea[id^=note-]").forEach(t=>t.oninput=()=>{notes=t.value;});
  if(keepId && $(keepId)){ $(keepId).focus(); try{ if(sel!=null) $(keepId).setSelectionRange(sel,sel);}catch{} }
}
function renderBar(){
  const launch = Object.keys(T.apps).map(a=>`<button type="button" class="bbtn" data-app="${a}" title="${T.apps[a]}">${icon[a]}</button>`).join("");
  $("launch").innerHTML = `<button type="button" class="bbtn neo" id="neobtn" aria-haspopup="menu">◆ Neo</button>${launch}`;
  $("running").innerHTML = [...running].map(a=>`<button type="button" class="bbtn on" data-run="${a}" title="${T.apps[a]}">${icon[a]}<span class="lbl">${T.apps[a]}</span></button>`).join("");
  const t=new Date().toLocaleTimeString(SR?"sr-Latn":"en-GB",{hour:"2-digit",minute:"2-digit"});
  $("helpers").innerHTML = `<button type="button" class="bbtn tray" id="findbtn" title="Ctrl+Space">⌕</button><span class="tray">86% · ${t}</span>`;
  $("neobtn").onclick = e => { e.stopPropagation(); toggleMenu(); };
  $("findbtn").onclick = e => { e.stopPropagation(); openPalette(); };
  screen.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>startApp(b.dataset.app));
  screen.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{ running.delete(b.dataset.run); toast(T.closed(T.apps[b.dataset.run])); renderBar(); });
}
function startApp(a){ running.add(a); toast(T.started(T.apps[a])); renderBar(); }
function toggleMenu(force){
  const m=$("menu"); const show = force ?? m.hidden;
  if(show){ m.innerHTML = T.neoMenu.map(([k,l])=>k==="-"?"<hr>":k==="h"?`<small>${l}</small>`:`<button type="button" data-m="${k}">${l}</button>`).join(""); m.querySelectorAll("button").forEach(b=>b.onclick=()=>{ toggleMenu(false); if(b.dataset.m==="pal") openPalette(); else toast(b.textContent); }); }
  m.hidden=!show;
}
const ITEMS = () => [
  ...Object.keys(T.apps).map(a=>({k:"app",id:a,n:T.apps[a]})),
  ...TILE_ORDER.map(t=>({k:"tile",id:t,n:T.tiles[t]})),
  ...(SR?[["Pismo baki"],["Budžet 2027"],["Beleške sa časa"]]:[["Letter to Gran"],["Budget 2027"],["Class notes"]]).map(([n])=>({k:"doc",n})),
  {k:"cmd",n:SR?"Promeni izgled u Kristal":"Switch the look to Crystal",do:()=>setLook("kristal")},
  {k:"cmd",n:SR?"Raspored Lako":"Easy layout",do:()=>setLayout("lako")},
];
let palSel=0;
function openPalette(){ toggleMenu(false); $("palette").hidden=false; $("pq").value=""; palSel=0; renderPalette(); $("pq").focus(); }
function closePalette(){ $("palette").hidden=true; }
function palMatches(){ const q=$("pq").value.trim().toLowerCase(); return ITEMS().filter(i=>!q || i.n.toLowerCase().includes(q)).slice(0,8); }
function renderPalette(){
  const list=palMatches(); palSel=Math.min(palSel,Math.max(0,list.length-1));
  $("pl").innerHTML = list.map((i,j)=>`<li><button type="button" class="${j===palSel?"sel":""}" data-j="${j}"><span>${i.n}</span><small>${T.kinds[i.k]}</small></button></li>`).join("");
  $("pl").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(list[+b.dataset.j]));
}
function choose(i){
  if(!i) return; closePalette();
  if(i.k==="app") startApp(i.id);
  else if(i.k==="tile"){ if(!shelf.includes(i.id)) shelf.push(i.id); face[i.id]="big"; renderTiles(); toast(T.pinned(i.n)); }
  else if(i.k==="cmd") i.do();
  else toast((SR?"Otvaram ":"Opening ")+i.n);
}
$("pq").addEventListener("input",()=>{palSel=0;renderPalette();});
$("pq").addEventListener("keydown",e=>{ const list=palMatches();
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(list.length-1,palSel+1);renderPalette();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);renderPalette();}
  else if(e.key==="Enter"){e.preventDefault();choose(list[palSel]);}
  else if(e.key==="Escape"){closePalette();}
});
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.code==="Space"){ e.preventDefault(); $("palette").hidden?openPalette():closePalette(); } if(e.key==="Escape"){ toggleMenu(false); closePalette(); } });
document.addEventListener("click",e=>{ if(!$("menu").hidden && !e.target.closest("#menu")) toggleMenu(false); if(!$("palette").hidden && !e.target.closest("#palette") && !e.target.closest("#findbtn")) closePalette(); });

function setLook(l){ screen.dataset.look=l; document.querySelectorAll("#looks button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===l)); }
function setLayout(l){ screen.dataset.layout=l; document.querySelectorAll("#layouts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===l)); }
$("looks").innerHTML = Object.entries(T.looks).map(([k,v])=>`<button type="button" data-v="${k}">${v}</button>`).join("");
$("layouts").innerHTML = Object.entries(T.layouts).map(([k,v])=>`<button type="button" data-v="${k}">${v}</button>`).join("");
$("looks").querySelectorAll("button").forEach(b=>b.onclick=()=>setLook(b.dataset.v));
$("layouts").querySelectorAll("button").forEach(b=>b.onclick=()=>setLayout(b.dataset.v));

$("deskicons").innerHTML = Object.keys(T.apps).map(a=>`<button type="button" class="dicon" data-app="${a}">${icon[a].replace('viewBox','width="44" height="44" viewBox')}<span>${T.apps[a]}</span></button>`).join("");
$("deskicons").querySelectorAll("[data-app]").forEach(b=>b.ondblclick=()=>startApp(b.dataset.app));
$("lako").innerHTML = `<h2>${T.lakoH}</h2><div class="big">${T.lakoB.map((x,i)=>`<button type="button" data-l="${i}">${x}</button>`).join("")}</div>`;
$("lako").querySelectorAll("button").forEach(b=>b.onclick=()=>startApp(["pero","ormar","preg"][+b.dataset.l]));

$("back").textContent=T.back; $("h1").textContent=T.h1; $("lead").textContent=T.lead;
$("l-look").textContent=T.look; $("l-layout").textContent=T.layout;
$("pq").placeholder=T.palPh; $("pq").setAttribute("aria-label",T.palPh);
$("h-a").textContent=T.hA; $("l-a").innerHTML=T.lA.map(x=>`<li>${x}</li>`).join("");
$("h-b").textContent=T.hB; $("l-b").innerHTML=T.lB.map(x=>`<li>${x}</li>`).join("");
$("h-c").textContent=T.hC; $("p-c").textContent=T.pC;
setLook("staklo"); setLayout("neo"); renderTiles(); renderBar();
setInterval(()=>{ cpuHist.push(Math.max(3,Math.min(97,cpuHist.at(-1)+(Math.random()-.5)*14))); cpuHist.shift(); if(!screen.contains(document.activeElement)||document.activeElement.tagName!=="TEXTAREA") renderTiles(); },1000);
setInterval(renderBar,30000);
</script>
