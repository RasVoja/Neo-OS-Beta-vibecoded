<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Desk: demo</title><link rel="stylesheet" href="first-desk.css"></head>
<body class="fd fd-desktop">
  <div class="fd-window">
    <div class="fd-titlebar"><button class="fd-close" aria-label="Close"></button><span class="fd-title">Settings</span><button class="fd-zoom" aria-label="Zoom"></button></div>
    <div class="fd-content">
      <p><b>Language</b></p>
      <label class="fd-radio"><input type="radio" name="l" checked> Serbian (Latin)</label>
      <label class="fd-radio"><input type="radio" name="l"> Serbian (Cyrillic)</label>
      <label class="fd-radio"><input type="radio" name="l"> English</label>
      <label class="fd-check"><input type="checkbox" checked> Change without restarting</label>
      <p><button class="fd-button default">OK</button> <button class="fd-button">Cancel</button></p>
      <p>Scroll bars appear when the content is taller than the window. This text exists to make it so.</p>
      <p>First Desk is a theme in the spirit of the first graphical computers: black and white, one bit per dot.</p>
    </div>
  </div>
</body></html>
