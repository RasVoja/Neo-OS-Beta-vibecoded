# Neo programs built for Genode (decision 0001). Their own workspace, so the
# `genode` feature of neo-rt does not leak into the Fortress programs. Each
# program is a static library that a Genode component in repos/neo links.
[workspace]
resolver = "2"
members = ["neo-hello", "neo-echo-server", "neo-echo-client"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
