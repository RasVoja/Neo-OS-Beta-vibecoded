<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Dijana, basset hound with a red scarf and a ladybug, resident of NBPOS (animated)</title>
  <style>
    .tail  { transform-box: fill-box; transform-origin: 90% 95%; animation: wag .7s ease-in-out infinite alternate; }
    .ear   { transform-box: fill-box; transform-origin: 80% 5%;  animation: sway 2.6s ease-in-out infinite alternate; }
    .eye   { transform-box: fill-box; transform-origin: 50% 40%; animation: blink 4.5s infinite; }
    .torso { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3s ease-in-out infinite alternate; }
    .scarf { transform-box: fill-box; transform-origin: 20% 10%; animation: flutter 2.2s ease-in-out infinite alternate; }
    .bug   { animation: crawl 7s ease-in-out infinite alternate; }
    @keyframes wag    { from { transform: rotate(-12deg); } to { transform: rotate(16deg); } }
    @keyframes sway   { from { transform: rotate(-2deg); }  to { transform: rotate(4deg); } }
    @keyframes blink  { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes breathe{ from { transform: scaleY(1); } to { transform: scaleY(1.018); } }
    @keyframes flutter{ from { transform: rotate(-1.5deg); } to { transform: rotate(2deg); } }
    @keyframes crawl  { from { transform: translate(327px,82px) rotate(-18deg); } to { transform: translate(334px,100px) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .tail,.ear,.eye,.torso,.scarf,.bug { animation: none; } }
  </style>
  <defs>
    <linearGradient id="tan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e29a55"/><stop offset="1" stop-color="#b9672a"/></linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9622c"/><stop offset="1" stop-color="#7a431d"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2530"/><stop offset="1" stop-color="#15121a"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6dcc8"/></linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0483d"/><stop offset="1" stop-color="#b3281f"/></linearGradient>
    <radialGradient id="gloss" cx=".35" cy=".3" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="bodyclip"><ellipse cx="195" cy="162" rx="135" ry="64"/></clipPath>
    <clipPath id="headclip"><ellipse cx="322" cy="112" rx="55" ry="51"/></clipPath>
  </defs>
  <g id="dijana" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="200" cy="271" rx="160" ry="8" fill="#000" opacity=".13"/>

    <g id="toy" transform="translate(356 252)">
      <ellipse cx="0" cy="0" rx="17" ry="12" fill="#d4372b" stroke="#2b1a12" stroke-width="3"/>
      <path d="M0 -12 V12" stroke="#2b1a12" stroke-width="2.5"/>
      <circle cx="-7" cy="-4" r="2.4" fill="#2b1a12"/><circle cx="7" cy="4" r="2.4" fill="#2b1a12"/>
      <circle cx="-17" cy="2" r="7" fill="#2b1a12" stroke="#2b1a12" stroke-width="3"/>
    </g>

    <g id="tail" class="tail">
      <path d="M72 135 C45 120 38 92 52 66" fill="none" stroke="#2b1a12" stroke-width="20"/>
      <path d="M72 135 C45 120 38 92 52 66" fill="none" stroke="url(#tan)" stroke-width="12"/>
      <path d="M52 66 l-3 6" stroke="#fffaf0" stroke-width="10"/>
    </g>

    <g stroke="#2b1a12" stroke-width="4" fill="#dcd2bd">
      <rect x="140" y="190" width="34" height="74" rx="14"/>
      <rect x="262" y="190" width="34" height="74" rx="14"/>
    </g>

    <g id="torso" class="torso">
      <ellipse cx="195" cy="162" rx="135" ry="64" fill="url(#white)"/>
      <g clip-path="url(#bodyclip)">
        <ellipse cx="150" cy="118" rx="115" ry="52" fill="url(#coat)"/>
        <ellipse cx="292" cy="128" rx="48" ry="44" fill="url(#tan)"/>
        <ellipse cx="150" cy="104" rx="70" ry="10" fill="#fff" opacity=".07"/>
      </g>
      <ellipse cx="195" cy="162" rx="135" ry="64" fill="none" stroke="#2b1a12" stroke-width="4"/>
    </g>

    <g stroke="#2b1a12" stroke-width="4" fill="url(#white)">
      <rect x="102" y="192" width="38" height="72" rx="15"/>
      <rect x="226" y="192" width="38" height="72" rx="15"/>
    </g>
    <path d="M108 252 h26 M232 252 h26" stroke="#2b1a12" stroke-width="3"/>

    <g id="head">
      <ellipse cx="354" cy="140" rx="44" ry="32" fill="#2b1a12"/>
      <ellipse cx="322" cy="112" rx="58" ry="54" fill="#2b1a12"/>
      <ellipse cx="322" cy="112" rx="55" ry="51" fill="url(#tan)"/>
      <ellipse cx="357" cy="141" rx="41" ry="29" fill="url(#tan)"/>
      <path d="M318 62 C330 68 334 92 342 134 L326 140 C314 104 312 82 318 62 Z" fill="url(#white)"/>
      <ellipse cx="364" cy="160" rx="32" ry="16" fill="url(#white)"/>
      <path d="M333 122 C346 144 362 148 388 143" fill="none" stroke="#2b1a12" stroke-width="3" opacity=".45"/>
      <ellipse cx="391" cy="132" rx="14" ry="11" fill="#1e1e26" stroke="#2b1a12" stroke-width="3"/>
      <ellipse cx="387" cy="128" rx="5" ry="2.8" fill="#fff" opacity=".65"/>
      <circle cx="340" cy="135" r="2" fill="#2b1a12" opacity=".5"/><circle cx="352" cy="140" r="2" fill="#2b1a12" opacity=".5"/>
      <g id="eye" class="eye">
        <ellipse cx="344" cy="108" rx="12" ry="11" fill="#3a2216" stroke="#2b1a12" stroke-width="3"/>
        <ellipse cx="344" cy="108" rx="12" ry="11" fill="url(#gloss)" opacity=".5"/>
        <circle cx="347.5" cy="104" r="3.6" fill="#fff"/><circle cx="340" cy="112" r="1.6" fill="#fff" opacity=".7"/>
        <path d="M331 118 Q344 130 357 118 Q344 122 331 118 Z" fill="#e58b8b" stroke="#2b1a12" stroke-width="2"/>
      </g>
      <path d="M330 92 Q344 83 358 94" fill="none" stroke="#2b1a12" stroke-width="3"/>
      <!-- ladybug on the blaze -->
      <g id="bug" class="bug" transform="translate(327 82) rotate(-18)">
        <ellipse cx="0" cy="1" rx="8" ry="7" fill="#d4372b" stroke="#2b1a12" stroke-width="2"/>
        <path d="M0 -6 V8" stroke="#2b1a12" stroke-width="1.6"/>
        <circle cx="-3.4" cy="0" r="1.5" fill="#2b1a12"/><circle cx="3.4" cy="3" r="1.5" fill="#2b1a12"/><circle cx="3.2" cy="-2.2" r="1.2" fill="#2b1a12"/>
        <circle cx="0" cy="-7.5" r="3" fill="#2b1a12"/>
        <path d="M-1.5 -9.5 l-2 -3 M1.5 -9.5 l2 -3" stroke="#2b1a12" stroke-width="1.2"/>
        <ellipse cx="-3" cy="-2" rx="2.4" ry="1.4" fill="#fff" opacity=".55"/>
      </g>
    </g>

    <g id="ear" class="ear">
      <path d="M296 70 C268 72 262 130 266 190 C268 222 288 224 300 196 C312 160 316 100 296 70 Z" fill="url(#ear)" stroke="#2b1a12" stroke-width="4"/>
      <path d="M292 88 C281 102 281 150 285 186" fill="none" stroke="#d58a47" stroke-width="8" opacity=".55"/>
    </g>

    <!-- scarf with a star -->
    <g id="scarf" class="scarf">
      <path d="M255 96 C272 120 276 150 262 182" fill="none" stroke="#2b1a12" stroke-width="22"/>
      <path d="M255 96 C272 120 276 150 262 182" fill="none" stroke="url(#scarf)" stroke-width="14"/>
      <path d="M268 168 Q296 160 324 172 L298 224 Z" fill="url(#scarf)" stroke="#2b1a12" stroke-width="4"/>
      <polygon points="295.0,181.0 297.2,186.9 303.6,187.2 298.6,191.2 300.3,197.3 295.0,193.8 289.7,197.3 291.4,191.2 286.4,187.2 292.8,186.9" fill="#f6c93c" stroke="#8a6a10" stroke-width="1.2"/>
    </g>
  </g>
